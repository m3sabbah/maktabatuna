<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتبتنا</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2a2118;--mut:#8a7a68;--acc:#8b4a2b;--acc2:#f1e3d3;--line:#e6dccd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1814;--card:#28221c;--ink:#f1e9dd;--mut:#a89883;--acc:#e0a173;--acc2:#3a2f25;--line:#3a3128}}
:root[data-theme="dark"]{--bg:#1c1814;--card:#28221c;--ink:#f1e9dd;--mut:#a89883;--acc:#e0a173;--acc2:#3a2f25;--line:#3a3128}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
.screen{display:none;height:100%;flex-direction:column}.screen.on{display:flex}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.bar h2{margin:0;font-size:1.05rem;flex:1}
.ib{width:40px;height:40px;border-radius:12px;background:var(--acc2);font-size:1.15rem;display:grid;place-items:center}
.pill{background:var(--acc);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600}
#home{align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#home h1{font-size:2.6rem;margin:0;color:var(--acc)}#home p{color:var(--mut);margin:0 0 18px}
.big{width:min(320px,100%);padding:20px;border-radius:18px;font-size:1.2rem;font-weight:700;background:var(--acc);color:#fff}
.big.alt{background:var(--card);color:var(--ink);border:2px solid var(--acc)}
.sm{display:flex;gap:10px;margin-top:10px}.sm button{background:var(--acc2);border-radius:10px;padding:8px 14px;font-size:.9rem}
#cam{background:#000;position:relative}
#vid{flex:1;width:100%;min-height:0;object-fit:cover}
#camTop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-start:10px}
#camTop button{background:#0009;color:#fff;border-radius:20px;padding:8px 14px}
#cnt{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-end:10px;background:#0009;color:#fff;border-radius:20px;padding:8px 14px}
#shut{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:50%;transform:translateX(-50%);width:74px;height:74px;border-radius:50%;background:#fff;border:6px solid #fff6;background-clip:padding-box}
#hint{position:absolute;bottom:110px;width:100%;text-align:center;color:#fff;font-size:.9rem;text-shadow:0 1px 4px #000}
#fallback{display:none;margin:auto;text-align:center;color:#fff;padding:20px}
.sheet{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;padding:14px;gap:10px;overflow:auto;z-index:5}
.sheet.on{display:flex}
.prev{height:26vh;object-fit:contain;background:var(--acc2);border-radius:12px}
label{font-size:.85rem;color:var(--mut)}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.busy{color:var(--acc);font-size:.9rem;min-height:1.2em}
.row{display:flex;gap:10px}.row>*{flex:1}
.tools{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap;align-items:center}
.tools select{width:auto;padding:8px}
#sb{display:none;padding:8px 12px}#sb.on{display:block}
#list{flex:1;overflow:auto;padding:8px 12px 20px}
.it{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:12px;padding:8px;margin-bottom:8px;width:100%;text-align:start}
.it img{width:52px;height:78px;object-fit:cover;border-radius:6px;background:var(--acc2)}
.it b{display:block}.it small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--acc2)}
.empty{text-align:center;color:var(--mut);margin-top:60px}
#det{overflow:auto}.dbody{display:flex;gap:16px;padding:16px;flex-wrap:wrap}
.dbody img{width:min(46%,260px);min-width:150px;border-radius:10px;box-shadow:0 4px 16px #0004;align-self:flex-start;flex:0 0 auto}
.dbody div{flex:1;min-width:160px;display:flex;flex-direction:column;gap:10px}
.dbody h3{margin:0;font-size:1.4rem}.dbody .a{font-size:1.1rem}.dbody .c{color:var(--acc);font-weight:600}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
.chip{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px}.chip small{color:var(--mut);display:block}
.sbody{padding:16px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-width:480px;width:100%;margin:0 auto}.sbody h4{margin:6px 0 0}.sbody hr{border:0;border-top:1px solid var(--line);width:100%}.pill.alt{background:var(--acc2);color:var(--ink)}#login input{max-width:320px;text-align:center}
</style>
</head>
<body>

<section id="home" class="screen on">

    <div class="busy" id="busy"></div>
    <div><label id="lT"></label><input id="fT"></div>
    <div><label id="lA"></label><input id="fA"></div>
    <div><label id="lC"></label><select id="fC"></select></div>
    <div class="row"><button class="pill" id="bSave"></button><button class="ib" style="width:auto;padding:0 14px" id="bDisc"></button></div>
    <div class="row"><button class="pill alt" id="bSrch"></button><button class="pill alt" id="bBar"></button></div>
    <div id="sug"></div>
  </div>
</section>

<section id="lib" class="screen">
  <div class="bar"><button class="ib" id="lBack">→</button><h2 id="lH"></h2><button class="ib" id="bS">🔍</button><button class="ib" id="bV">▦</button></div>
  <div id="sb"><input id="q" type="search"></div>
  <div class="tools"><select id="sf"></select><button class="ib" id="sd">↑</button><span id="cn" style="color:var(--mut);font-size:.85rem"></span></div>
  <div id="list"></div>
</section>

<section id="det" class="screen">
  <div class="bar"><button class="ib" id="dBack">→</button><h2 id="dH"></h2><button class="ib" id="dEdit">✎</button></div>
  <div class="dbody"><img id="dImg" alt=""><div id="dInfo"></div></div>
</section>
<div id="toast"></div>

/* ---------- Arabic-aware fuzzy search ---------- */
const norm=s=>(s||"").normalize("NFD").replace(/[\u0300-\u036f\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ؤ]/g,"و").replace(/[ئ]/g,"ي").toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[n]}

/* ---------- Custom categories ---------- */

 const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL,max_tokens:400,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:d}},{type:"text",text:prompt+" Return the JSON object only, no other text."}]}]})});
 if(!r.ok)throw r.status;const j=await r.json();return JSON.parse(j.content.map(c=>c.text||"").join("").replace(/```json|```/g,"").trim())}
$("kGo").onclick=()=>{const k=$("kIn").value.trim();if(!k)return;try{localStorage.setItem("akey",k)}catch(e){}$("kIn").value="";$("kIn").placeholder="sk-ant-•••• ✓";toast(t("ksaved"))};
if(getKey())$("kIn").placeholder="sk-ant-•••• ✓";

/* ---------- Admin password ---------- */
const DEF="42e75ff5f116f83760552a91e4685482dac81dcf9783d28cf18e431724d8b9cb";
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,"0")).join("");
const getH=()=>{try{return localStorage.getItem("pwh")||DEF}catch(e){return DEF}};
$("lgGo").onclick=async()=>{if(await sha($("lgP").value)==getH()){try{sessionStorage.setItem("ok","1")}catch(e){}$("lgP").value="";$("lgE").textContent="";isAdm=true;const nf=afterLogin;afterLogin=null;nf?nf():show("home")}else $("lgE").textContent=t("wrong")};
let isAdm=false,afterLogin=null,backTo="home";try{isAdm=sessionStorage.getItem("ok")=="1"}catch(e){}
function needAdmin(fn){if(isAdm)return fn();backTo=document.querySelector(".screen.on").id;afterLogin=fn;$("lgE").textContent="";show("login");$("lgP").focus()}
$("lgX").onclick=()=>{afterLogin=null;$("lgP").value="";show(backTo)};
$("lgP").onkeydown=e=>{if(e.key=="Enter")$("lgGo").click()};
$("bOut").onclick=()=>{try{sessionStorage.removeItem("ok")}catch(e){}isAdm=false;show("home")};
$("bSet").onclick=()=>needAdmin(()=>show("set"));$("sBack").onclick=()=>show("home");
$("pGo").onclick=async()=>{const a=$("p0").value,b=$("p1").value,c=$("p2").value;if(await sha(a)!=getH())return toast(t("wrong"));if(b.length<4)return toast(t("short"));if(b!=c)return toast(t("mism"));try{localStorage.setItem("pwh",await sha(b))}catch(e){}$("p0").value=$("p1").value=$("p2").value="";toast(t("pwok"))};

/* ---------- Backup / restore ---------- */
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const d2b=d=>{const [h,s]=d.split(","),m=h.match(/:(.*?);/)[1],x=atob(s),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return new Blob([u],{type:m})};
$("bBak").onclick=async()=>{if(!books.length)return toast(t("noex"));const items=[];for(const b of books)items.push({id:b.id,title:b.title,author:b.author,cat:b.cat,added:b.added,cover:await b2d(b.cover)});
await saveFile("maktabatuna-backup-"+new Date().toISOString().slice(0,10)+".json",new Blob([JSON.stringify({app:"maktabatuna",v:1,books:items})],{type:"application/json"}))};
$("bImp").onclick=()=>$("impF").click();
$("impF").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!="maktabatuna"||!Array.isArray(j.books))throw 0;let n=0;for(const x of j.books){if(!x.id||!x.cover)continue;const b={id:String(x.id),title:x.title||"—",author:x.author||"",cat:x.cat||"",added:x.added||Date.now(),cover:d2b(x.cover)};b.url=URL.createObjectURL(b.cover);const i=books.findIndex(y=>y.id==b.id);if(i>=0)books[i]=b;else books.push(b);await put(b);n++}toast(t("impok")+" "+n)}catch(err){toast(t("impbad"))}};

/* ---------- Cloud storage (Supabase): public read, admin write ---------- */
let sess=null;try{sess=JSON.parse(sessionStorage.getItem("sess")||"null")}catch(e){}
isAdm=!!sess;
const H=tk=>({apikey:KEY,Authorization:"Bearer "+(tk||KEY)});
function setSess(j){sess={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000};try{sessionStorage.setItem("sess",JSON.stringify(sess))}catch(e){}}
async function signIn(pw){try{const r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"content-type":"application/json"},body:JSON.stringify({email:ADMIN_EMAIL,password:pw})});if(!r.ok)return false;setSess(await r.json());return true}catch(e){return false}}
async function token(){if(!sess)throw"auth";if(Date.now()>sess.exp-60000){const r=await fetch(SB+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"content-type":"application/json"},body:JSON.stringify({refresh_token:sess.rt})});if(!r.ok){sess=null;throw"auth"}setSess(await r.json())}return sess.at}
const curl=id=>SB+"/storage/v1/object/public/covers/"+encodeURIComponent(id)+".jpg";
async function sync(b){const tk=await token();if(b.cover){const r=await fetch(SB+"/storage/v1/object/covers/"+encodeURIComponent(b.id)+".jpg",{method:"POST",headers:{...H(tk),"content-type":"image/jpeg","x-upsert":"true"},body:b.cover});if(!r.ok)throw 0;b.url=curl(b.id)+"?v="+Date.now();b.cover=null}
const r=await fetch(SB+"/rest/v1/books",{method:"POST",headers:{...H(tk),"content-type":"application/json",Prefer:"resolution=merge-duplicates"},body:JSON.stringify({id:b.id,title:b.title,author:b.author,cat:b.cat,cover_url:b.url,added:b.added})});if(!r.ok)throw 0}
function put(b){const bg=!!b.cover&&!books.includes(b),p=sync(b).catch(e=>{if(e==="auth"){isAdm=false;sess=null}if(bg){books=books.filter(x=>x!==b);if($("lib").classList.contains("on"))render()}toast("⚠ "+t("upfail"))});return bg?Promise.resolve():p}
async function del(b){try{const tk=await token(),o={method:"DELETE",headers:H(tk)};await fetch(SB+"/rest/v1/books?id=eq."+encodeURIComponent(b.id),o);await fetch(SB+"/storage/v1/object/covers/"+encodeURIComponent(b.id)+".jpg",o)}catch(e){toast("⚠ "+t("upfail"))}}
async function load(){try{let all=[],from=0;for(;;){const r=await fetch(SB+"/rest/v1/books?select=*&order=added.desc",{headers:{...H(),Range:from+"-"+(from+999),"Range-Unit":"items"}});if(!r.ok)throw 0;const j=await r.json();all=all.concat(j);if(j.length<1000)break;from+=1000}
books=all.map(x=>({id:x.id,title:x.title,author:x.author,cat:x.cat,added:x.added,url:x.cover_url}))}catch(e){toast(t("loadfail"))}fillCat($("fC"),"");if($("lib").classList.contains("on"))render()}
$("bBrowse").onclick=()=>{show("lib");render();load()};
$("lgGo").onclick=async()=>{$("lgE").textContent="";if(await signIn($("lgP").value)){$("lgP").value="";isAdm=true;const nf=afterLogin;afterLogin=null;nf?nf():show("home")}else $("lgE").textContent=t("wrong")};
$("bOut").onclick=()=>{sess=null;try{sessionStorage.removeItem("sess")}catch(e){}isAdm=false;show("home")};
$("pGo").onclick=async()=>{const a=$("p0").value,b=$("p1").value,c=$("p2").value;if(!(await signIn(a)))return toast(t("wrong"));if(b.length<6)return toast(t("short"));if(b!=c)return toast(t("mism"));try{const r=await fetch(SB+"/auth/v1/user",{method:"PUT",headers:{...H(await token()),"content-type":"application/json"},body:JSON.stringify({password:b})});if(!r.ok)throw 0;$("p0").value=$("p1").value=$("p2").value="";toast(t("pwok"))}catch(e){toast("⚠")}};
$("bBak").onclick=async()=>{if(!books.length)return toast(t("noex"));toast("⏳");const items=[];for(const b of books){try{const bl=await(await fetch(b.url)).blob();items.push({id:b.id,title:b.title,author:b.author,cat:b.cat,added:b.added,cover:await b2d(bl)})}catch(e){}}
await saveFile("maktabatuna-backup-"+new Date().toISOString().slice(0,10)+".json",new Blob([JSON.stringify({app:"maktabatuna",v:1,books:items})],{type:"application/json"}))};

applyLang();bindCat($("fC"));load();
show("home");
</script>
</body>
</html>
